<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Dashboards Power BI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        body {
            background: #000;
            display: flex;
            flex-direction: column;
        }

        /* Header minimalista */
        .header {
            background: #2c3e50;
            color: white;
            padding: 8px 15px;
            height: 50px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #f2c811;
        }

        .header h1 {
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Layout principal */
        .main-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 50px);
            overflow: hidden;
        }

        /* Sidebar compacto */
        .sidebar {
            width: 250px;
            background: #34495e;
            color: white;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            border-right: 1px solid #4a6278;
        }

        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid #4a6278;
        }

        .sidebar-header h2 {
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .dashboard-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px;
        }

        .dashboard-item {
            padding: 8px 10px;
            margin: 2px 0;
            background: #4a6278;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-item:hover {
            background: #5a7288;
        }

        .dashboard-item.active {
            background: #f2c811;
            color: #2c3e50;
            font-weight: bold;
        }

        .item-actions {
            display: flex;
            gap: 3px;
        }

        .item-actions button {
            background: none;
            border: none;
            color: inherit;
            cursor: pointer;
            padding: 2px;
            font-size: 0.7rem;
        }

        /* Área principal - 100% pantalla */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #000;
        }

        .dashboard-header {
            background: #2c3e50;
            color: white;
            padding: 5px 10px;
            height: 35px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
        }

        .dashboard-container {
            flex: 1;
            background: #000;
            margin: 0;
            padding: 0;
            position: relative;
        }

        .dashboard-frame {
            width: 80%;
            height: 80%;
            border: none;
            margin: 0;
            padding: 0;
            display: block;
            background: #000;
        }

        /* Estados vacíos */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #666;
            text-align: center;
            padding: 20px;
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: #888;
        }

        /* Botones */
        button {
            background: #f2c811;
            color: #2c3e50;
            border: none;
            padding: 6px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #e6b90a;
        }

        button.btn-secondary {
            background: #4a6278;
            color: white;
        }

        button.btn-secondary:hover {
            background: #5a7288;
        }

        button.btn-danger {
            background: #e74c3c;
            color: white;
        }

        button.btn-danger:hover {
            background: #c0392b;
        }

        /* Modales */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 5px;
            width: 90%;
            max-width: 500px;
            transform: translateY(-20px);
            transition: transform 0.3s;
        }

        .modal.show .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h2 {
            font-size: 1.1rem;
            color: #2c3e50;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #666;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
            color: #2c3e50;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 0.9rem;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
            font-family: monospace;
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 15px;
        }

        /* Utilidades */
        .hidden {
            display: none !important;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: 150px;
                border-right: none;
                border-bottom: 1px solid #4a6278;
            }
            
            .dashboard-list {
                display: flex;
                gap: 5px;
                padding: 5px;
                overflow-x: auto;
            }
            
            .dashboard-item {
                min-width: 120px;
                white-space: nowrap;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <h1>
            <i class="fas fa-chart-line"></i>
            Visualizador Power BI
        </h1>
        <div class="header-actions">
            <button id="addDashboardBtn">
                <i class="fas fa-plus"></i> Nuevo Dashboard
            </button>
        </div>
    </div>

    <!-- Contenedor Principal -->
    <div class="main-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Dashboards</h2>
            </div>
            <div class="dashboard-list" id="dashboardList">
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-folder-open"></i>
                    <p>No hay dashboards</p>
                </div>
            </div>
        </div>

        <!-- Área de Contenido -->
        <div class="content-area">
            <div class="dashboard-header">
                <div class="dashboard-title" id="dashboardTitle">Selecciona un dashboard</div>
                <div class="dashboard-info" id="dashboardInfo"></div>
            </div>
            
            <div id="dashboardViewer">
                <!-- Estado vacío -->
                <div class="empty-state" id="noDashboard">
                    <i class="fas fa-chart-bar"></i>
                    <h2>Sin dashboard seleccionado</h2>
                    <p>Selecciona un dashboard de la lista o agrega uno nuevo</p>
                </div>

                <!-- Contenedor del dashboard -->
                <div class="dashboard-container hidden" id="dashboardContainer">
                    <iframe class="dashboard-frame" id="dashboardFrame" 
                            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
                            allowfullscreen>
                    </iframe>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar dashboard -->
    <div class="modal" id="dashboardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Agregar Dashboard</h2>
                <button class="close-modal" id="closeModal">&times;</button>
            </div>
            <form id="dashboardForm">
                <div class="form-group">
                    <label for="dashboardName">Nombre del Dashboard</label>
                    <input type="text" id="dashboardName" required placeholder="Ej: Ventas 2024">
                </div>
                <div class="form-group">
                    <label for="dashboardIframe">Código iframe de Power BI</label>
                    <textarea id="dashboardIframe" required placeholder='&lt;iframe title="Dashboard" width="100%" height="100%" src="https://app.powerbi.com/..." frameborder="0" allowFullScreen="true"&gt;&lt;/iframe&gt;'></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" id="saveBtn">Guardar Dashboard</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal de confirmación para eliminar -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Confirmar Eliminación</h2>
                <button class="close-modal" id="closeDeleteModal">&times;</button>
            </div>
            <p>¿Estás seguro de que deseas eliminar este dashboard? Esta acción no se puede deshacer.</p>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelDeleteBtn">Cancelar</button>
                <button type="button" class="btn-danger" id="confirmDeleteBtn">Eliminar</button>
            </div>
        </div>
    </div>

    <script>
        // Estado de la aplicación
        const state = {
            dashboards: JSON.parse(localStorage.getItem('powerbiDashboards')) || [
                {
                    id: '1',
                    name: 'Muro de los recuerdos',
                    iframe: '<iframe title="Muro de los recuerdos" width="100%" height="100%" src="https://app.powerbi.com/view?r=eyJrIjoiZDVmOGZlMWMtN2VkYS00NmRkLWJiZDYtMjUxNmMxZjI3OTRhIiwidCI6ImU0YmQ2NzExLWE3NGYtNGQzYi1hOWU1LThkYzQ3MjFmZmUxOCIsImMiOjR9" frameborder="0" allowFullScreen="true"></iframe>'
                },
                {
                    id: '2',
                    name: 'Facturación',
                    iframe: '<iframe title="Facturación" width="100%" height="100%" src="https://app.powerbi.com/view?r=eyJrIjoiMjAzN2U0MjktYjE4ZS00Y2U2LWE0Y2ItYjRjYzJhMGI2YzJjIiwidCI6ImU0YmQ2NzExLWE3NGYtNGQzYi1hOWU1LThkYzQ3MjFmZmUxOCIsImMiOjR9" frameborder="0" allowFullScreen="true"></iframe>'
                }
            ],
            currentDashboard: null,
            editingId: null
        };

        // Elementos DOM
        const elements = {
            // Lista de dashboards
            dashboardList: document.getElementById('dashboardList'),
            emptyState: document.getElementById('emptyState'),
            
            // Vista principal
            noDashboard: document.getElementById('noDashboard'),
            dashboardContainer: document.getElementById('dashboardContainer'),
            dashboardFrame: document.getElementById('dashboardFrame'),
            dashboardTitle: document.getElementById('dashboardTitle'),
            dashboardInfo: document.getElementById('dashboardInfo'),
            
            // Botones
            addDashboardBtn: document.getElementById('addDashboardBtn'),
            
            // Modales
            dashboardModal: document.getElementById('dashboardModal'),
            deleteModal: document.getElementById('deleteModal'),
            
            // Formularios
            dashboardForm: document.getElementById('dashboardForm'),
            dashboardName: document.getElementById('dashboardName'),
            dashboardIframe: document.getElementById('dashboardIframe'),
            modalTitle: document.getElementById('modalTitle'),
            
            // Botones de modales
            closeModal: document.getElementById('closeModal'),
            cancelBtn: document.getElementById('cancelBtn'),
            saveBtn: document.getElementById('saveBtn'),
            closeDeleteModal: document.getElementById('closeDeleteModal'),
            cancelDeleteBtn: document.getElementById('cancelDeleteBtn'),
            confirmDeleteBtn: document.getElementById('confirmDeleteBtn')
        };

        // Funciones de utilidad
        function showModal(modal) {
            modal.classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function hideModal(modal) {
            modal.classList.remove('show');
            document.body.style.overflow = '';
        }

        // Renderizar lista de dashboards
        function renderDashboards() {
            elements.dashboardList.innerHTML = '';
            
            if (state.dashboards.length === 0) {
                elements.emptyState.classList.remove('hidden');
                return;
            }
            
            elements.emptyState.classList.add('hidden');
            
            state.dashboards.forEach(dashboard => {
                const item = document.createElement('div');
                item.className = `dashboard-item ${state.currentDashboard === dashboard.id ? 'active' : ''}`;
                item.dataset.id = dashboard.id;
                
                item.innerHTML = `
                    <span>${dashboard.name}</span>
                    <div class="item-actions">
                        <button class="edit" title="Editar"><i class="fas fa-edit"></i></button>
                        <button class="delete" title="Eliminar"><i class="fas fa-trash"></i></button>
                    </div>
                `;
                
                // Eventos
                item.querySelector('.edit').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openEditModal(dashboard.id);
                });
                
                item.querySelector('.delete').addEventListener('click', (e) => {
                    e.stopPropagation();
                    openDeleteModal(dashboard.id);
                });
                
                item.addEventListener('click', () => {
                    selectDashboard(dashboard.id);
                });
                
                elements.dashboardList.appendChild(item);
            });
        }

        // Seleccionar dashboard
        function selectDashboard(id) {
            state.currentDashboard = id;
            const dashboard = state.dashboards.find(d => d.id === id);
            
            if (dashboard) {
                elements.noDashboard.classList.add('hidden');
                elements.dashboardContainer.classList.remove('hidden');
                elements.dashboardTitle.textContent = dashboard.name;
                elements.dashboardInfo.innerHTML = '<small>Microsoft Power BI</small>';
                
                // Extraer URL del iframe
                const srcMatch = dashboard.iframe.match(/src="([^"]*)"/);
                if (srcMatch && srcMatch[1]) {
                    let srcUrl = srcMatch[1];
                    // Optimizar URL para visualización completa
                    if (!srcUrl.includes('?')) srcUrl += '?';
                    if (!srcUrl.includes('autoAuth=true')) srcUrl += '&autoAuth=true';
                    if (!srcUrl.includes('navContentPaneEnabled=false')) srcUrl += '&navContentPaneEnabled=false';
                    
                    elements.dashboardFrame.src = srcUrl;
                }
                
                renderDashboards();
            }
        }

        // Modal functions
        function openAddModal() {
            state.editingId = null;
            elements.modalTitle.textContent = 'Agregar Dashboard';
            elements.dashboardName.value = '';
            elements.dashboardIframe.value = '';
            showModal(elements.dashboardModal);
        }

        function openEditModal(id) {
            state.editingId = id;
            const dashboard = state.dashboards.find(d => d.id === id);
            
            if (dashboard) {
                elements.modalTitle.textContent = 'Editar Dashboard';
                elements.dashboardName.value = dashboard.name;
                elements.dashboardIframe.value = dashboard.iframe;
                showModal(elements.dashboardModal);
            }
        }

        function openDeleteModal(id) {
            state.editingId = id;
            showModal(elements.deleteModal);
        }

        function saveDashboard() {
            const name = elements.dashboardName.value.trim();
            const iframe = elements.dashboardIframe.value.trim();
            
            if (!name || !iframe) {
                alert('Por favor completa todos los campos');
                return;
            }
            
            if (!iframe.includes('<iframe') || !iframe.includes('</iframe>')) {
                alert('Por favor ingresa un código iframe válido');
                return;
            }
            
            if (state.editingId) {
                // Editar existente
                const index = state.dashboards.findIndex(d => d.id === state.editingId);
                if (index !== -1) {
                    state.dashboards[index].name = name;
                    state.dashboards[index].iframe = iframe;
                }
            } else {
                // Nuevo dashboard
                state.dashboards.push({
                    id: Date.now().toString(),
                    name,
                    iframe
                });
            }
            
            localStorage.setItem('powerbiDashboards', JSON.stringify(state.dashboards));
            hideModal(elements.dashboardModal);
            renderDashboards();
            
            if (state.editingId) {
                selectDashboard(state.editingId);
            } else if (state.dashboards.length === 1) {
                selectDashboard(state.dashboards[0].id);
            }
        }

        function deleteDashboard() {
            state.dashboards = state.dashboards.filter(d => d.id !== state.editingId);
            
            if (state.currentDashboard === state.editingId) {
                state.currentDashboard = null;
                elements.noDashboard.classList.remove('hidden');
                elements.dashboardContainer.classList.add('hidden');
            }
            
            localStorage.setItem('powerbiDashboards', JSON.stringify(state.dashboards));
            hideModal(elements.deleteModal);
            renderDashboards();
        }

        // Event Listeners
        elements.addDashboardBtn.addEventListener('click', openAddModal);
        elements.closeModal.addEventListener('click', () => hideModal(elements.dashboardModal));
        elements.cancelBtn.addEventListener('click', () => hideModal(elements.dashboardModal));
        elements.dashboardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            saveDashboard();
        });
        elements.closeDeleteModal.addEventListener('click', () => hideModal(elements.deleteModal));
        elements.cancelDeleteBtn.addEventListener('click', () => hideModal(elements.deleteModal));
        elements.confirmDeleteBtn.addEventListener('click', deleteDashboard);

        // Cerrar modales con clic fuera o ESC
        window.addEventListener('click', (e) => {
            if (e.target === elements.dashboardModal) hideModal(elements.dashboardModal);
            if (e.target === elements.deleteModal) hideModal(elements.deleteModal);
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                hideModal(elements.dashboardModal);
                hideModal(elements.deleteModal);
            }
        });

        // Inicializar
        renderDashboards();
        if (state.dashboards.length > 0 && !state.currentDashboard) {
            selectDashboard(state.dashboards[0].id);
        }

        // Ajustar iframe al redimensionar
        window.addEventListener('resize', () => {
            if (state.currentDashboard) {
                elements.dashboardFrame.style.width = '100%';
                elements.dashboardFrame.style.height = '100%';
            }
        });
    </script>
</body>
</html>
